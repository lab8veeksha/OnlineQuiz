<!DOCTYPE html>
<html>

<head>

    <title>QuizMaster - Quiz</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .quiz-box {

            width: 650px;

            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;
        }

        .header h2 {
            color: #667eea;
        }

        .timer {

            background: #ff4757;

            color: white;

            padding: 10px 18px;

            border-radius: 20px;

            font-weight: bold;
        }

        .question {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 25px;

            color: #333;
        }

        .option {

            display: block;

            padding: 15px;

            margin: 12px 0;

            border: 2px solid #ddd;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.3s;
        }

        .option:hover {

            border-color: #667eea;

            background: #f0f2ff;
        }

        .option input {

            margin-right: 10px;
        }

        .next-btn {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 12px;

            background: #667eea;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        .next-btn:hover {

            background: #764ba2;
        }

    </style>

</head>


<body>


<div class="quiz-box">


    <div class="header">

        <h2>
            🧠 QuizMaster
        </h2>

        <div class="timer" id="timer">
            ⏱ 60
        </div>

    </div>


    <div class="question">

        1. Which language is used to create Django applications?

    </div>


    <label class="option">

        <input type="radio" name="answer">

        Java

    </label>


    <label class="option">

        <input type="radio" name="answer">

        Python

    </label>


    <label class="option">

        <input type="radio" name="answer">

        C++

    </label>


    <label class="option">

        <input type="radio" name="answer">

        JavaScript

    </label>


    <button class="next-btn">

        Next Question →

    </button>


</div>


<script>

let time = 60;

let timer = setInterval(function() {

    time--;

    document.getElementById("timer").innerHTML =
        "⏱ " + time;

    if (time <= 0) {

        clearInterval(timer);

        alert("⏰ Time's up!");

    }

}, 1000);

</script>


</body>

</html>
